# Render Blueprint: New + > Blueprint, pick this repo. Secrets marked sync:false are asked for in the dashboard.
services:
  - type: web
    name: interviewra-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Neon / Supabase connection string
      - key: SECRET_KEY
        generateValue: true  # strong random value (>= 32 chars) created by Render
      - key: CORS_ORIGINS
        sync: false          # https://your-app.vercel.app (no trailing slash; comma separated for more)
      - key: LLM_PROVIDER
        value: gemini        # or groq
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
