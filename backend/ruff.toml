# Lint = real bugs only (syntax errors, unused or undefined names, risky patterns). Formatting is left alone.
target-version = "py311"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "B008",  # FastAPI Depends(...) in argument defaults is the framework's idiom
  "B904",  # re-raise without "from" is deliberate in a few places (hide internals from the client)
  "B905",  # zip() without strict=
]
